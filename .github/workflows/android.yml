# Compila la app nativa Android (Capacitor) y publica el APK en GitHub Releases:
# https://github.com/cashlessmot2026/gym/releases/tag/apk-latest
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - 'index.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Build web (base /)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk IronYellow-Gym.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IronYellow-Gym-apk
          path: IronYellow-Gym.apk

      - name: Publish release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest IronYellow-Gym.apk \
            --title "IronYellow Gym · APK Android (build ${{ github.run_number }})" \
            --notes "APK compilado automáticamente desde el commit ${{ github.sha }}. Descárgalo en el celular Android y ábrelo para instalar (permite 'Instalar apps de fuentes desconocidas')." \
            --latest
