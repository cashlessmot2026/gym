# Mantiene actualizado el nutricionista: cada lunes descarga de PubMed (NIH) las
# publicaciones nuevas de nutrición deportiva y vuelve a publicar la web.
name: Actualizar fuentes de nutrición

on:
  schedule:
    - cron: '0 11 * * 1'   # lunes 6:00 a. m. hora Colombia
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-nutrition.mjs
      - name: Guardar cambios
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/nutrition-updates.json
          if git diff --cached --quiet; then echo "changed=false" >> $GITHUB_OUTPUT; exit 0; fi
          git commit -m "Actualiza publicaciones de nutrición deportiva (PubMed)"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT
      - name: Volver a publicar la web
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
